[options]
number = 10
theme = "main"
ssh_theme = "pascal"

[keys]
leader = " "

[keys.normal]
"h" = false
"j" = "left"
"k" = "down"
"l" = "up"
";" = "right"
"<leader>d" = ":bd!<CR>"
"<leader>wk"  = ":sp<CR>"
"<leader>wl"  = ":vs<CR>"
"<C-q>" = ":q<CR>"
"<leader>s" = ":symbols<CR>"
"<leader>ww" = "window_pick"
"<C-k>" = ":m+1<CR>"
"<C-l>" = ":m-2<CR>"
