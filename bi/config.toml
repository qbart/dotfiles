[keys.visual]
# Visual falls back to [keys.normal] for everything it does not
# claim, so a motion rebound there applies here too. Only put a
# key here to make the two modes differ.
[keys.tree]
"h" = false
"j" = "tree_collapse"
"k" = "tree_select_down"
"l" = "tree_select_up"
";" = "tree_expand"
